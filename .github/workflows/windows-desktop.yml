name: Build Hawr Gallery for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - "shared/**"
      - "drizzle/**"
      - "electron/**"
      - "assets/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify project
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Setup Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install icon generation dependencies
        run: python -m pip install cairosvg pillow

      - name: Build branding assets
        run: python scripts/build-icon.py

      - name: Build Windows installer
        run: pnpm desktop:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verify desktop production bundle
        run: pnpm desktop:verify

      - name: Smoke test desktop server
        run: pnpm desktop:smoke

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: HawrGallery-Windows-Installer
          path: release/*
          if-no-files-found: error
          retention-days: 30
