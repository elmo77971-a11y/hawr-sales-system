<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>جارٍ تشغيل معرض حور</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", Tahoma, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f7f5; color: #0b1020; }
    main { text-align: center; padding: 40px; }
    .mark { width: 72px; height: 72px; margin: 0 auto 22px; border-radius: 18px; display: grid; place-items: center; background: #e30613; color: #fff; font-size: 40px; font-weight: 900; box-shadow: 0 14px 30px rgba(11, 16, 32, .14); }
    h1 { margin: 0; font-size: 24px; }
    p { margin: 10px 0 0; color: #64748b; }
    .dots { display: flex; justify-content: center; gap: 7px; margin-top: 24px; }
    .dots span { width: 8px; height: 8px; border-radius: 999px; background: #e30613; animation: pulse 1s infinite ease-in-out; }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: .7; } }
  </style>
</head>
<body>
  <main>
    <div class="mark">ح</div>
    <h1>معرض حور للأدوات المنزلية</h1>
    <p>جارٍ تشغيل النظام المحلي، يرجى الانتظار...</p>
    <div class="dots" aria-label="جارٍ التحميل"><span></span><span></span><span></span></div>
  </main>
</body>
</html>
