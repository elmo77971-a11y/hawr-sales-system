<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإعداد الأولي — معرض حور</title><style>body{margin:0;background:#f7f7f5;color:#0b1020;font-family:Segoe UI,Tahoma,sans-serif}.shell{max-width:620px;margin:42px auto;padding:0 28px}.brand{display:flex;align-items:center;gap:14px}.mark{width:54px;height:54px;border-radius:14px;background:#e30613;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900}.card{margin-top:28px;background:#fff;border:1px solid #e5e7eb;padding:28px;box-shadow:0 12px 35px #0b10200f}h1{margin:0 0 8px;font-size:26px}p{color:#64748b;line-height:1.8}.step{color:#e30613;font-weight:800;font-size:13px}label{display:block;margin:22px 0 8px;font-weight:800;font-size:14px}input{width:100%;box-sizing:border-box;height:44px;border:1px solid #cbd5e1;padding:0 12px;font-size:15px}button{margin-top:24px;width:100%;height:46px;background:#0b1020;color:#fff;border:0;font-weight:800;font-size:15px;cursor:pointer}button:hover{background:#e30613}.check{display:flex;gap:9px;align-items:center;margin-top:20px;color:#475569;font-size:14px}.check input{width:18px;height:18px}</style></head><body><main class="shell"><div class="brand"><div class="mark">ح</div><div><strong>معرض حور</strong><div style="color:#64748b;font-size:13px">نظام المبيعات والمخزون المحلي</div></div></div><section class="card"><div class="step">الخطوة 1 من 1</div><h1>تهيئة البرنامج لأول مرة</h1><p>اكتب اسم المعرض الذي سيظهر في البرنامج والإيصالات. ستُحفظ البيانات على هذا الكمبيوتر داخل قاعدة SQLite محلية.</p><form id="setup"><label for="name">اسم المعرض</label><input id="name" value="معرض حور للأدوات المنزلية" required><label class="check"><input id="backup" type="checkbox" checked> تفعيل تذكير النسخ الاحتياطي</label><button type="submit">بدء استخدام البرنامج</button></form></section></main><script>document.getElementById('setup').addEventListener('submit',async e=>{e.preventDefault();const button=e.currentTarget.querySelector('button');button.disabled=true;button.textContent='جارٍ الحفظ...';await window.hawrDesktop.completeSetup({galleryName:document.getElementById('name').value,backupReminder:document.getElementById('backup').checked})})</script></body></html>
